apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels:
    app: redis
    tier: backing
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  labels:
    app: redis
    tier: backing
spec:
  clusterIP: None
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app: redis
---
# STAGING SINGLE INSTANCE - NOT PRODUCTION HA
# Production workloads will utilize AWS Managed ElastiCache Redis Multi-AZ per H8-C architecture decision.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app: redis
    tier: backing
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        tier: backing
    spec:
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:8.0-alpine
          command:
            - /bin/sh
            - -c
            - |
              cat <<'EOF' > /tmp/redis.conf
              appendonly yes
              dir /data
              EOF
              if [ -n "$REDIS_PASSWORD" ]; then
                echo "requirepass \"$REDIS_PASSWORD\"" >> /tmp/redis.conf
              fi
              chmod 600 /tmp/redis.conf
              exec redis-server /tmp/redis.conf
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fieldforge-secrets
                  key: REDIS_PASSWORD
                  optional: true
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: fieldforge-secrets
                  key: REDIS_PASSWORD
                  optional: true
          startupProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 15
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
