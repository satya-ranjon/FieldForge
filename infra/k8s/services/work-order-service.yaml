apiVersion: apps/v1
kind: Deployment
metadata:
  name: work-order-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: work-order-service
  template:
    metadata:
      labels:
        app: work-order-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: work-order-service
          image: fieldforge/work-order-service:latest
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: fieldforge-global-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fieldforge-secrets
                  key: JWT_SECRET
            - name: INTERNAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: fieldforge-secrets
                  key: INTERNAL_SERVICE_SECRET
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fieldforge-secrets
                  key: DB_PASSWORD
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fieldforge-secrets
                  key: RABBITMQ_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fieldforge-secrets
                  key: REDIS_PASSWORD
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: work-order-service
spec:
  selector:
    app: work-order-service
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002
