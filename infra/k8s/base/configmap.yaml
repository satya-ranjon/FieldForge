apiVersion: v1
kind: ConfigMap
metadata:
  name: fieldforge-global-config
data:
  NODE_ENV: 'production'
  LOG_LEVEL: 'info'
  DB_HOST: 'mysql-service'
  DB_PORT: '3306'
  DB_NAME: 'fieldforge'
  DB_USER: 'fieldforge'
  REDIS_HOST: 'redis-service'
  REDIS_PORT: '6379'
  RABBITMQ_HOST: 'rabbitmq-service'
  RABBITMQ_PORT: '5672'
  RABBITMQ_USER: 'fieldforge'
  AUTH_SERVICE_URL: 'http://auth-service:8001'
  WORK_ORDER_SERVICE_URL: 'http://work-order-service:8002'
  DISPATCH_SERVICE_URL: 'http://dispatch-service:8003'
  BILLING_SERVICE_URL: 'http://billing-service:8004'
  AWS_REGION: 'us-east-1'
  S3_DELIVERABLES_BUCKET: 'fieldforge-deliverables-storage-staging'
