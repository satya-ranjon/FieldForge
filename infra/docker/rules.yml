groups:
  - name: fieldforge-slos
    interval: 15s
    rules:
      - record: fieldforge:api_availability:ratio_5m
        expr: >-
          sum(rate(http_requests_total{status_code!~"5.."}[5m]))
          /
          (sum(rate(http_requests_total[5m])) > 0 or 1)

      - record: fieldforge:read_latency:p95_seconds_5m
        expr: >-
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket{method="GET"}[5m])) by (le)
          )

      - record: fieldforge:write_latency:p95_seconds_5m
        expr: >-
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket{method=~"POST|PUT|PATCH"}[5m])) by (le)
          )

      - record: fieldforge:dispatch_queue_latency:p99_seconds_5m
        expr: >-
          histogram_quantile(
            0.99,
            sum(rate(dispatch_fanout_latency_seconds_bucket[5m])) by (le)
          )

      - record: fieldforge:billing_reconciliation_failures:rate_1h
        expr: >-
          sum(rate(billing_reconciliation_failures_total[1h])) or 0
