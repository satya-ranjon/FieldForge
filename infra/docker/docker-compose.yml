version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: fieldforge-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: fieldforge_secret
      MYSQL_DATABASE: fieldforge
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7.4-alpine
    container_name: fieldforge-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: fieldforge-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: fieldforge-jaeger
    restart: always
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
