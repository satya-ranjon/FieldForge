name: Kubernetes Scaffold Check

on:
  push:
    paths:
      - 'infra/k8s/**'
      - 'scripts/k8s-deploy-staging.sh'
      - 'scripts/k8s-run-db-migration.sh'
      - '.github/workflows/k8s-deploy.yml'
  pull_request:
    paths:
      - 'infra/k8s/**'
      - 'scripts/k8s-deploy-staging.sh'
      - 'scripts/k8s-run-db-migration.sh'
      - '.github/workflows/k8s-deploy.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate staging deployment orchestrator syntax
        run: |
          bash -n scripts/k8s-deploy-staging.sh
          echo "✅ k8s-deploy-staging.sh shell syntax valid."

      - name: Validate migration runner syntax
        run: |
          bash -n scripts/k8s-run-db-migration.sh
          echo "✅ k8s-run-db-migration.sh shell syntax valid."

      - name: Render the platform Kustomize scaffold
        run: |
          kubectl kustomize infra/k8s > /tmp/fieldforge-k8s.yaml
          test -s /tmp/fieldforge-k8s.yaml
          # Verify migration Job is NOT present in the root platform render.
          # Direct `kubectl apply -k infra/k8s` must never be used as the
          # deployment command — use scripts/k8s-deploy-staging.sh instead.
          if grep -q 'name: fieldforge-db-migrate' /tmp/fieldforge-k8s.yaml; then
            echo "ERROR: fieldforge-db-migrate Job found in root kustomize render."
            echo "The migration Job must live exclusively in infra/k8s/migrations/."
            exit 1
          fi
          echo "✅ Root render verified: migration Job correctly absent."

      - name: Render the migration Kustomize scaffold
        run: |
          kubectl kustomize infra/k8s/migrations > /tmp/fieldforge-migrations.yaml
          test -s /tmp/fieldforge-migrations.yaml
          # Verify exactly one migration Job is present
          JOB_COUNT=$(grep -c 'kind: Job' /tmp/fieldforge-migrations.yaml || true)
          if [ "$JOB_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 Job in migration render, found: ${JOB_COUNT}"
            exit 1
          fi
          echo "✅ Migration render verified: exactly 1 Job present."

      - name: Report deployment status
        run: |
          echo 'The current Kubernetes files are a scaffold only.'
          echo 'Cluster authentication and production deployment are intentionally not configured.'
          echo ''
          echo 'Authoritative staging deployment procedure:'
          echo '  ./scripts/k8s-deploy-staging.sh'
          echo ''
          echo 'What that script enforces:'
          echo '  1. Apply ConfigMap + backing infra only (no application Deployments)'
          echo '  2. Wait for MySQL, Redis, RabbitMQ pod readiness'
          echo '  3. scripts/k8s-run-db-migration.sh  (migration Job: delete→apply→wait)'
          echo '  4. kubectl apply -k infra/k8s       (apps, only if migration succeeds)'
          echo '  5. kubectl rollout status for all 6 service Deployments'
          echo ''
          echo 'DO NOT use: kubectl apply -k infra/k8s  as the deployment command.'
          echo 'Real cluster credentials and CD pipeline automation are H8-D work.'
